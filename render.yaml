services:
  - type: web
    name: mizzou-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: "https://your-frontend-domain.example.com"


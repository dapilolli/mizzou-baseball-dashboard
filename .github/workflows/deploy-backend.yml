name: Trigger Render Backend Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend.py'
      - 'requirements.txt'
      - 'data/**'
      - 'render.yaml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick backend syntax check
        run: |
          python3 -m py_compile backend.py || true

      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true

